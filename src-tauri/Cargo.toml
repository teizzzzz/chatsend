[package]
name = "chatsend"
version = "0.9.0"
description = "ChatSend desktop shell — send files between your devices like chat messages"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
