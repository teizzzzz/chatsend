name: Release builds

# Build native packages for every platform. Trigger by pushing a tag like
# v0.10.0, or manually from the Actions tab (workflow_dispatch).
#
# Optional: set a repository variable CHATSEND_SERVER_URL
# (e.g. wss://chatsend.example.com/ws) to bake the signalling server into
# the packaged apps; without it, users set the URL in Settings → Server.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  VITE_SIGNALING_URL: ${{ vars.CHATSEND_SERVER_URL }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # NSIS setup .exe + .msi
            bundles: src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest # .dmg + .app
            bundles: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-latest # .deb + .AppImage
            bundles: src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux webview dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundles (tauri build runs npm run build first)
        run: npm run desktop:build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: chatsend-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into the Android project
        run: |
          npm run build
          npx cap sync android

      # Debug APK: signed with the auto-generated debug key, installable
      # directly on any device with "unknown sources" enabled. For a Play
      # Store release, add a keystore via secrets and run assembleRelease
      # with signingConfig instead.
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatsend-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
